<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Ultra Vibrant Metallic Gold Gradient -->
    <linearGradient id="vibrantGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF385" />
      <stop offset="35%" stop-color="#FFB800" />
      <stop offset="75%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <!-- Deep Glowing Obsidian Visor -->
    <linearGradient id="vibrantVisor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Neon Cyber Cyan Eye Glow -->
    <linearGradient id="neonEyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Sleek 3D Pearl Head Gradient -->
    <linearGradient id="vibrantHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="85%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <!-- Glow Filter for Neon Cyan Eyes -->
    <filter id="neonCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gold Accent Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FF8A00" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Golden Crown Antenna -->
  <circle cx="32" cy="6.5" r="3.8" fill="url(#vibrantGold)" filter="url(#goldGlow)" />
  <line x1="32" y1="9.5" x2="32" y2="15" stroke="url(#vibrantGold)" stroke-width="2.6" stroke-linecap="round" />

  <!-- Metallic Gold Side Ear-Pods -->
  <rect x="6.5" y="25" width="6" height="15" rx="3" fill="url(#vibrantGold)" filter="url(#goldGlow)" />
  <rect x="51.5" y="25" width="6" height="15" rx="3" fill="url(#vibrantGold)" filter="url(#goldGlow)" />

  <!-- 3D Robot Head Outer Hull -->
  <rect x="9.5" y="13" width="45" height="39" rx="15" fill="url(#vibrantHead)" stroke="#FFFFFF" stroke-width="1.5" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.4))" />

  <!-- Visor Bezel in Rich Gold -->
  <rect x="14" y="20" width="36" height="23" rx="9" fill="none" stroke="url(#vibrantGold)" stroke-width="1.8" />

  <!-- Deep Obsidian Screen -->
  <rect x="15" y="21" width="34" height="21" rx="8" fill="url(#vibrantVisor)" />

  <!-- Crystal Glass Reflection Curve -->
  <path d="M 17 23 Q 32 20 47 23 A 7 7 0 0 0 43 28 Q 32 25 21 28 A 7 7 0 0 1 17 23 Z" fill="#FFFFFF" opacity="0.35" />

  <!-- Neon Glowing Left Eye -->
  <circle cx="24.5" cy="31" r="4.2" fill="url(#neonEyeGrad)" filter="url(#neonCyanGlow)" />
  <circle cx="26" cy="29.5" r="1.5" fill="#FFFFFF" />

  <!-- Neon Glowing Right Eye -->
  <circle cx="39.5" cy="31" r="4.2" fill="url(#neonEyeGrad)" filter="url(#neonCyanGlow)" />
  <circle cx="41" cy="29.5" r="1.5" fill="#FFFFFF" />

  <!-- Friendly Vibrant Smile -->
  <path d="M 28 38 Q 32 41 36 38" stroke="#00F0FF" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#neonCyanGlow)" />

  <!-- Sparkling Golden Star Emblem -->
  <path d="M 32 54 L 33.8 57.5 L 37.5 59 L 33.8 60.5 L 32 64 L 30.2 60.5 L 26.5 59 L 30.2 57.5 Z" fill="url(#vibrantGold)" filter="url(#goldGlow)" />
</svg>
