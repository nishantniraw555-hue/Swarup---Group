<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Soft Headlight Gradient -->
    <linearGradient id="launcherHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Deep Visor Gradient -->
    <linearGradient id="launcherVisorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Cyan Eyes -->
    <linearGradient id="launcherEyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gold Accents -->
    <linearGradient id="launcherGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="launcherGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Antenna -->
  <circle cx="32" cy="7" r="3.2" fill="url(#launcherGold)" />
  <line x1="32" y1="10" x2="32" y2="15" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />

  <!-- Side Ear Pods -->
  <rect x="7" y="27" width="5" height="13" rx="2.5" fill="url(#launcherGold)" />
  <rect x="52" y="27" width="5" height="13" rx="2.5" fill="url(#launcherGold)" />

  <!-- Robot Head Box -->
  <rect x="10" y="14" width="44" height="37" rx="14" fill="url(#launcherHeadGrad)" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))" />

  <!-- Visor -->
  <rect x="15" y="21" width="34" height="21" rx="8" fill="url(#launcherVisorGrad)" stroke="#38bdf8" stroke-width="1" />

  <!-- Glossy Reflection on Visor -->
  <path d="M 18 23 Q 32 21 46 23 A 6 6 0 0 0 42 27 Q 32 25 22 27 A 6 6 0 0 1 18 23 Z" fill="#ffffff" opacity="0.22" />

  <!-- Friendly Cyan Eyes with Highlights -->
  <circle cx="25" cy="31" r="3.8" fill="url(#launcherEyeGrad)" filter="url(#launcherGlow)" />
  <circle cx="26.2" cy="29.8" r="1.3" fill="#ffffff" />

  <!-- Right Eye -->
  <circle cx="39" cy="31" r="3.8" fill="url(#launcherEyeGrad)" filter="url(#launcherGlow)" />
  <circle cx="40.2" cy="29.8" r="1.3" fill="#ffffff" />

  <!-- Smile / Voice Indicator -->
  <path d="M 28 37.5 Q 32 40 36 37.5" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Tiny Gold Sparkle Base -->
  <path d="M 32 54 L 33.5 57 L 36.5 58.5 L 33.5 60 L 32 63 L 30.5 60 L 27.5 58.5 L 30.5 57 Z" fill="url(#launcherGold)" />
</svg>
