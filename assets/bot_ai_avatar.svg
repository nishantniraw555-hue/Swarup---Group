<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Rich Deep Royal Sapphire Base Gradient -->
    <linearGradient id="vibrantAvatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Ultra Vibrant Metallic Gold Gradient -->
    <linearGradient id="vibrantAvatarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF385" />
      <stop offset="35%" stop-color="#FFB800" />
      <stop offset="75%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <!-- 3D Pearl Head Gradient -->
    <linearGradient id="vibrantAvatarHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <!-- Deep Visor Gradient -->
    <linearGradient id="vibrantAvatarVisor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Neon Cyber Cyan Eye Glow -->
    <linearGradient id="neonAvatarEye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="neonEyeGlowAvatar" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="goldGlowAvatar" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#FF8A00" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Circular Outer Badge in Royal Blue & Gold Border -->
  <circle cx="50" cy="50" r="48" fill="url(#vibrantAvatarBg)" stroke="url(#vibrantAvatarGold)" stroke-width="3.5" />

  <!-- Antenna -->
  <circle cx="50" cy="16.5" r="5" fill="url(#vibrantAvatarGold)" filter="url(#goldGlowAvatar)" />
  <line x1="50" y1="20" x2="50" y2="28" stroke="url(#vibrantAvatarGold)" stroke-width="3" stroke-linecap="round" />

  <!-- Side Ear Pods -->
  <rect x="15" y="40" width="8" height="18" rx="4" fill="url(#vibrantAvatarGold)" filter="url(#goldGlowAvatar)" />
  <rect x="77" y="40" width="8" height="18" rx="4" fill="url(#vibrantAvatarGold)" filter="url(#goldGlowAvatar)" />

  <!-- 3D Robot Head -->
  <rect x="20" y="26" width="60" height="50" rx="18" fill="url(#vibrantAvatarHead)" stroke="#FFFFFF" stroke-width="2" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.5))" />

  <!-- Visor Gold Bezel -->
  <rect x="26" y="33" width="48" height="30" rx="12" fill="none" stroke="url(#vibrantAvatarGold)" stroke-width="2.2" />

  <!-- Obsidian Screen -->
  <rect x="27" y="34" width="46" height="28" rx="11" fill="url(#vibrantAvatarVisor)" />

  <!-- Visor Glass Reflection -->
  <path d="M 30 36 Q 50 33 70 36 A 9 9 0 0 0 64 43 Q 50 39 36 43 A 9 9 0 0 1 30 36 Z" fill="#FFFFFF" opacity="0.3" />

  <!-- Left Glowing Neon Cyan Eye -->
  <circle cx="40" cy="48" r="5.5" fill="url(#neonAvatarEye)" filter="url(#neonEyeGlowAvatar)" />
  <circle cx="42" cy="46" r="2" fill="#FFFFFF" />

  <!-- Right Glowing Neon Cyan Eye -->
  <circle cx="60" cy="48" r="5.5" fill="url(#neonAvatarEye)" filter="url(#neonEyeGlowAvatar)" />
  <circle cx="62" cy="46" r="2" fill="#FFFFFF" />

  <!-- Friendly Voice Curve / Smile -->
  <path d="M 44 57 Q 50 61 56 57" stroke="#00F0FF" stroke-width="2.6" stroke-linecap="round" fill="none" filter="url(#neonEyeGlowAvatar)" />

  <!-- Sparkling Golden Star Emblem -->
  <path d="M 50 80 L 52.5 84.5 L 57 86.5 L 52.5 88.5 L 50 93 L 47.5 88.5 L 43 86.5 L 47.5 84.5 Z" fill="url(#vibrantAvatarGold)" filter="url(#goldGlowAvatar)" />
</svg>
